# Reverse proxy in front of gunicorn (Phase 7). Mounted at
# /etc/nginx/conf.d/default.conf in the nginx container.

upstream app_server {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Match the app's 50 MB upload cap so big spreadsheets/decks aren't rejected
    # by nginx with a 413 before they ever reach Flask.
    client_max_body_size 50m;

    # Compress text responses (the SPA shell, JS/CSS, and every JSON API reply).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # The probe nginx itself can answer cheaply if needed; normally proxied.
    location / {
        proxy_pass http://app_server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Quick request/response cycle (long agent runs happen in a background
        # thread server-side), but allow headroom for large uploads.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# ===========================================================================
# HTTPS (enable AFTER ICP 备案 is approved and you have a cert + domain).
# The stack already publishes 443 and mounts your certs at /etc/nginx/certs
# (see docker-compose.yml). To switch HTTP → HTTPS:
#   1. Put your Aliyun cert files in  ./certs/  on the server, e.g.
#        ./certs/your-domain.pem   ./certs/your-domain.key
#   2. Replace `your-domain.com` below with your real domain.
#   3. COMMENT OUT the `server { listen 80; server_name _; ... }` block ABOVE
#      and UNCOMMENT the two blocks below.
#   4. `docker compose up -d`  (reloads nginx). TRUST_PROXY stays 1.
