[package]
name = "tangent-agent"
version = "0.1.0"
description = "Tangent AI — desktop agent shell"
authors = ["Tangent AI"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
keyring = "3"            # OS-keychain device-token storage (no token on disk)
rand = "0.8"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
