<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你的 AI 经营分析团队</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- =====================================================================
       SHELL (UI redesign Phase 2) — a minimal frame: top bar, <main id="view">,
       modals and the support FAB. Everything inside is rendered by the ES
       modules under /js (main.js boots the router; views fill #view).
       ===================================================================== -->
  <header class="topbar">
    <div class="topbar-inner">
      <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false" hidden>
        <span class="nav-toggle-icon" aria-hidden="true"></span>
      </button>
      <a class="brand" href="/" data-nav>
        <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
        <span class="brand-name" id="brandName">…</span>
      </a>
      <nav class="nav" id="mainNav" aria-label="主导航"></nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <!-- Mobile navigation sheet (rendered by main.js, mirrors the top nav). -->
  <div class="sheet-backdrop" id="navSheetBackdrop" hidden></div>
  <aside class="nav-sheet" id="navSheet" aria-hidden="true"></aside>

  <!-- The routed page. -->
  <main id="view" class="view"></main>

  <footer class="footer" id="footer"></footer>

  <!-- 联系支持 — floating button + popover (filled by main.js, needs META). -->
  <button class="support-fab" id="supportFab" type="button" hidden>💬 联系支持</button>
  <div class="support-pop" id="supportPop"></div>

  <!-- 新手引导 overlay (rendered by js/views/onboarding.js). -->
  <div id="onboardRoot"></div>

  <!-- Auth modals — 登录 / 注册 / 重置密码 (rendered by js/views/auth.js). -->
  <div id="modalRoot"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
