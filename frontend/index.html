<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- __PRODUCT_NAME__ / __BASE_URL__ are filled by the server from config
       (app.py _spa_shell) — scrapers reading a forwarded /reports/<id> link
       never run JS, so the brand must already be in the HTML (Phase 10 B5). -->
  <title>__PRODUCT_NAME__ · __PRODUCT_TAGLINE__</title>
  <meta name="description" content="把杂乱的 Excel 交给你的 AI 经营分析团队：每周一 08:00，一页可转发的经营报告准时送到企业微信和邮箱。不用配置，不写提示词，每个数字可溯源。" />
  <meta name="theme-color" content="#1f5eff" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="__PRODUCT_NAME__" />
  <meta property="og:title" content="__PRODUCT_NAME__ · __PRODUCT_TAGLINE__" />
  <meta property="og:description" content="周一早上，报告自己到。AI 团队把你的经营数据变成一页可转发的报告，每个数字可溯源。" />
  <meta property="og:image" content="__BASE_URL__assets/og-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="__PRODUCT_NAME__ · __PRODUCT_TAGLINE__" />
  <meta name="twitter:description" content="周一早上，报告自己到。AI 团队把你的经营数据变成一页可转发的报告，每个数字可溯源。" />
  <meta name="twitter:image" content="__BASE_URL__assets/og-card.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- LOCAL_MODE (desktop daemon): app.py _spa_shell injects the privacy banner and
       the per-session CSRF token here. On the cloud server these collapse to nothing
       (banner "", token "", mode false), so this file serves identically there. -->
  __LOCAL_BANNER__
  <script>
    window.__LOCAL_MODE__ = __TANGENT_LOCAL_MODE__;
    window.__LOCAL_TOKEN__ = "__TANGENT_LOCAL_TOKEN__";
    // Desktop build: the SPA is served by the LOCAL daemon, but auth + /v1 inference must
    // target the CLOUD. The daemon fills this from the paired account's cloud host; the
    // cloud server leaves it "" (relative URLs). NEVER a model id or ¥ rate.
    window.__CLOUD_BASE_URL__ = "__TANGENT_CLOUD_BASE__";
  </script>
  <!-- =====================================================================
       SHELL (UI redesign Phase 2) — a minimal frame: top bar, <main id="view">,
       modals and the support FAB. Everything inside is rendered by the ES
       modules under /js (main.js boots the router; views fill #view).
       ===================================================================== -->
  <header class="topbar">
    <div class="topbar-inner">
      <button class="nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false" hidden>
        <span class="nav-toggle-icon" aria-hidden="true"></span>
      </button>
      <button class="topbar-back" id="backBtn" type="button" aria-label="返回上一页" hidden>
        <span aria-hidden="true">←</span>
      </button>
      <a class="brand" href="/" data-nav>
        <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
        <span class="brand-name" id="brandName">…</span>
      </a>
      <nav class="nav" id="mainNav" aria-label="主导航"></nav>
      <div class="account" id="account"></div>
    </div>
  </header>

  <!-- Mobile navigation sheet (rendered by main.js, mirrors the top nav). -->
  <div class="sheet-backdrop" id="navSheetBackdrop" hidden></div>
  <aside class="nav-sheet" id="navSheet" aria-hidden="true"></aside>

  <!-- The routed page. -->
  <main id="view" class="view"></main>

  <footer class="footer" id="footer"></footer>

  <!-- 联系支持 — floating button + popover (filled by main.js, needs META). -->
  <button class="support-fab" id="supportFab" type="button" hidden>💬 联系支持</button>
  <div class="support-pop" id="supportPop"></div>

  <!-- 新手引导 overlay (rendered by js/views/onboarding.js). -->
  <div id="onboardRoot"></div>

  <!-- Auth modals — 登录 / 注册 / 重置密码 (rendered by js/views/auth.js). -->
  <div id="modalRoot"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
